[build]
  command = "npm run build"
  publish = "build/client"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[functions."*"]
  external_node_modules = ["@neondatabase/serverless", "bcryptjs", "razorpay"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200
